name: klinik_sanitasi_mobile
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  image_picker: ^1.2.3
  geolocator: ^14.1.1
  shared_preferences: ^2.5.6
  flutter_svg: ^2.0.0
  lottie: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpg

  fonts:
    - family: Heading Now
      fonts:
        - asset: assets/fonts/HeadingNow-Regular.ttf
          weight: 400
        - asset: assets/fonts/HeadingNow-Medium.ttf
          weight: 500
        - asset: assets/fonts/HeadingNow-Bold.ttf
          weight: 700